<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>天然色漢字フォーカスリーダー</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="top-app">
  <header id="top-header">
    <div id="logo-kanji">選</div>
    <div>
      <div id="logo-title">天然色漢字フォーカスリーダー</div>
      <div id="logo-sub">天然色漢字INDEX™ — 読書体験</div>
    </div>
  </header>

  <div id="mode-tabs">
    <button class="mode-tab" data-tab="books">作品から選ぶ</button>
    <button class="mode-tab active" data-tab="custom">テキストを貼り付ける</button>
  </div>

  <main id="tab-books" style="display:none">
    <div id="book-grid"></div>
  </main>

  <div id="tab-custom">
    <p class="section-label">論文・資料・ビジネス文書などを貼り付けてください</p>
    <textarea id="input-text" placeholder="ここにテキストを貼り付けてください。長文の資料、論文、ビジネス文書など何でもOKです。"></textarea>
    <p class="section-label">区切り方を選択</p>
    <div class="split-row">
      <button class="split-btn active" data-mode="kuten">句点（。）ごと</button>
      <button class="split-btn" data-mode="touten">読点（、）ごと</button>
      <button class="split-btn" data-mode="both">句点＋読点</button>
      <button class="split-btn" data-mode="line">改行ごと</button>
      <button class="split-btn" data-mode="word">単語ごと</button>
    </div>
    <button id="start-custom-btn" disabled>読み始める</button>
  </div>

  <footer id="top-footer">
    青空文庫収録作品（著作権消滅）を使用しています
  </footer>
</div>

<script src="data/kokoro.js"></script>
<script src="data/botchan.js"></script>
<script src="data/takekurabe.js"></script>
<script>
  const tabs = document.querySelectorAll('.mode-tab');
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('tab-books').style.display = tab.dataset.tab === 'books' ? 'block' : 'none';
      document.getElementById('tab-custom').style.display = tab.dataset.tab === 'custom' ? 'block' : 'none';
    });
  });

  const books = [KOKORO, BOTCHAN, TAKEKURABE];
  const grid = document.getElementById('book-grid');
  books.forEach(book => {
    const card = document.createElement('div');
    card.className = 'book-card';
    card.innerHTML = `
      <div class="book-kanji">${book.kanji}</div>
      <div class="book-info">
        <div class="book-title">${book.title}</div>
        <div class="book-author">${book.author}</div>
        <div class="book-desc">${book.description}</div>
      </div>
      <div class="book-lines">${book.lines.length}行</div>
    `;
    card.addEventListener('click', () => {
      localStorage.setItem('selectedBook', book.id);
      localStorage.removeItem('customChunks');
      window.location.href = 'reader.html';
    });
    grid.appendChild(card);
  });

  let splitMode = 'kuten';
  document.querySelectorAll('.split-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.split-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      splitMode = btn.dataset.mode;
    });
  });

  const inputText = document.getElementById('input-text');
  const startBtn = document.getElementById('start-custom-btn');
  inputText.addEventListener('input', () => { startBtn.disabled = inputText.value.trim().length < 5; });

  function splitText(text, m) {
    if (m === 'kuten')  return text.split(/(?<=。)/).map(s => s.trim()).filter(Boolean);
    if (m === 'touten') return text.split(/(?<=、)/).map(s => s.trim()).filter(Boolean);
    if (m === 'both')   return text.split(/(?<=[。、])/).map(s => s.trim()).filter(Boolean);
    if (m === 'line')   return text.split(/\n+/).map(s => s.trim()).filter(Boolean);
    if (m === 'word')   return text.match(/[\u4e00-\u9fff\u3040-\u30ff]{1,8}|[a-zA-Z0-9]+|[^\s]/g) || [];
    return [];
  }

  startBtn.addEventListener('click', () => {
    const chunks = splitText(inputText.value.trim(), splitMode);
    if (!chunks.length) return;
    localStorage.setItem('customChunks', JSON.stringify(chunks));
    localStorage.setItem('splitMode', splitMode);
    localStorage.removeItem('selectedBook');
    window.location.href = 'reader.html';
  });
</script>
</body>
</html>
